# Published contract for the charge API.
#
# This file is the machine-readable form of docs/api/charge.md. It is consumed by
# `coupon-service` to generate its client DTO, so a change here
# propagates into other teams' builds. Treat every constraint below as load-bearing:
#
#   - `cardType.enum` — the funding type. `cardNetwork` carries the network.
#   - `acquirerReference.pattern` — prefixed by the acquirer that issued it.
#   - `x-invariant` on ChargeResponse — `subtotal + surcharge + tax == total`.
openapi: 3.0.3

info:
  title: billing-service charge API
  version: 4.12.0
  description: >
    Invoicing and card charging for Northwind Retail. The charge response is a published
    contract with external consumers; see docs/api/charge.md for the stability rules.

servers:
  - url: http://billing-service.prod.internal

paths:
  /v1/charges:
    post:
      operationId: createCharge
      summary: Charge an invoice against a card. Preferred over the per-invoice path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeCommand'
      responses:
        '201':
          description: Charge taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeResponse'

  /v1/invoices/{invoiceId}/charge:
    post:
      operationId: chargeInvoice
      summary: Charge an invoice against a card, applying tax.
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeRequest'
      responses:
        '200':
          description: Charge taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeResponse'
        '400':
          description: Card number missing, or the network is not one we accept.
        '404':
          description: Invoice not found.
        '502':
          description: tax-service could not price the tax. We do not charge an untaxed amount.

components:
  schemas:

    ChargeCommand:
      type: object
      additionalProperties: false
      required: [invoiceId, cardNumber, currency]
      properties:
        invoiceId:
          type: string
        cardNumber:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        billingPostcode:
          type: string

    ChargeRequest:
      type: object
      additionalProperties: false
      required: [cardNumber, currency]
      properties:
        cardNumber:
          type: string
        currency:
          type: string
          minLength: 3
          maxLength: 3
        billingPostcode:
          type: string

    ChargeResponse:
      type: object
      additionalProperties: true
      x-invariant: subtotal + surcharge + tax == total
      x-consumers:
        - coupon-service
        - finance-reconciliation-export
      required:
        - chargeId
        - invoiceId
        - subtotal
        - surcharge
        - tax
        - total
        - currency
        - cardType
        - cardNetwork
        - acquirerReference
        - status
      properties:
        chargeId:
          type: string
          example: chg_9f3b7c21
        invoiceId:
          type: string
          example: inv-1001
        subtotal:
          type: string
          description: Invoice amount before surcharge and tax.
          example: '249.00'
        surcharge:
          type: string
          description: >
            Network surcharge. 1.5% for American Express, 0.00 for every other network.
          example: '0.00'
        tax:
          type: string
          description: Tax from tax-service, computed on the subtotal plus the surcharge.
          example: '49.80'
        total:
          type: string
          description: Amount actually charged. Equals subtotal + surcharge + tax.
          example: '298.80'
        currency:
          type: string
          example: GBP
        cardType:
          type: string
          enum: [CREDIT, CHARGE_CARD]
          description: How the card is funded. Amex is a charge card; Visa and Mastercard are credit.
          example: CREDIT
        cardNetwork:
          type: string
          enum: [VISA, MASTERCARD, AMEX]
          description: Card network. Consumers that need the network read it here.
          example: VISA
        acquirerReference:
          type: string
          pattern: '^(wp|amex)_[0-9a-fA-F-]+$'
          description: The acquirer's reference, needed for settlement, refunds and chargebacks.
          example: wp_4f8a21c7
        status:
          type: string
          enum: [CHARGED, DECLINED]
          example: CHARGED
